name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài đặt
        run: npm ci

      - name: Kiểm tra cú pháp
        run: npm run check

      - name: Test (bao gồm đọc dữ liệu JSON đời cũ)
        run: npm test

      - name: Tải Neutralino binaries
        run: npx neu update

      - name: Đóng gói yymmdd_T17_runtracker_vX.Y.Z.zip
        id: pack
        run: |
          npx neu build --release --embed-resources
          node scripts/package-win.mjs
          echo "name=$(cat release/RELEASE_NAME.txt)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          ls -la release

      - name: Tải lên artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: release/*.zip
          if-no-files-found: error

      # Mỗi khi version trong package.json đổi và được đẩy lên main → tự tạo tag vX.Y.Z + Release kèm file zip.
      - name: Kiểm tra Release đã tồn tại chưa
        id: rel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.pack.outputs.version }}" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Tạo GitHub Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rel.outputs.exists == 'false') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pack.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.pack.outputs.name }}
          files: release/*.zip
          generate_release_notes: true
